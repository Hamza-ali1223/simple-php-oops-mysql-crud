spring.application.name=oops-crud

# --- SQLite datasource (local development) ---
# The database file is created at the project root on first startup.
# To reset local data safely: stop the application and delete the app.db file,
# then start again; schema.sql recreates an empty users table.
spring.datasource.url=jdbc:sqlite:app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Run schema.sql on every startup; statements use IF NOT EXISTS so data is kept.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
