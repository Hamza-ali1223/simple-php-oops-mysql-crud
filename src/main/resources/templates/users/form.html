<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout((${userForm.id != null} ? 'Edit user' : 'Add user'), ~{::section})}">
<head>
  <meta charset="UTF-8">
  <title th:text="${userForm.id != null ? 'Edit user - User Management' : 'Add user - User Management'}">Add user - User Management</title>
  <link rel="stylesheet" th:href="@{/css/application.css}" href="../../static/css/application.css">
</head>
<body>
  <section>
    <div class="card form-layout">
      <div class="card-header">
        <div class="card-header-titles">
          <h1 class="card-title" th:text="${userForm.id != null ? 'Edit user' : 'Add user'}">Add user</h1>
          <p class="card-subtitle"
             th:text="${userForm.id != null ? 'Update existing user contact and profile details.' : 'Create a new user entry with name, email, and mobile number.'}">
            Create a new user entry with name, email, and mobile number.
          </p>
        </div>
      </div>

      <div class="card-body">
        <!-- Global error alerts if present -->
        <div th:replace="~{fragments/validation-errors :: globalErrors}"></div>

        <form th:action="${userForm.id != null} ? @{/users/{id}(id=${userForm.id})} : @{/users}"
              th:object="${userForm}"
              method="post"
              novalidate>

          <!-- Hidden id field for edit mode -->
          <input type="hidden" th:if="*{id != null}" th:field="*{id}">

          <!-- Name Field -->
          <div class="form-group">
            <label for="name" class="form-label">
              Name <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input type="text"
                   id="name"
                   th:field="*{name}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                   th:aria-invalid="${#fields.hasErrors('name')} ? 'true' : 'false'"
                   th:aria-describedby="${#fields.hasErrors('name')} ? 'name-error' : null"
                   placeholder="Enter full name"
                   required
                   autocomplete="name">
            <div th:replace="~{fragments/validation-errors :: fieldError('name')}"></div>
          </div>

          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">
              Email <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                   th:aria-invalid="${#fields.hasErrors('email')} ? 'true' : 'false'"
                   th:aria-describedby="${#fields.hasErrors('email')} ? 'email-error' : null"
                   placeholder="user@example.com"
                   required
                   autocomplete="email">
            <div th:replace="~{fragments/validation-errors :: fieldError('email')}"></div>
          </div>

          <!-- Mobile Field -->
          <div class="form-group">
            <label for="mobile" class="form-label">
              Mobile <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input type="tel"
                   id="mobile"
                   th:field="*{mobile}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('mobile')} ? 'is-invalid' : ''"
                   th:aria-invalid="${#fields.hasErrors('mobile')} ? 'true' : 'false'"
                   th:aria-describedby="${#fields.hasErrors('mobile')} ? 'mobile-error' : null"
                   placeholder="e.g. +1 555-0123"
                   required
                   autocomplete="tel">
            <div th:replace="~{fragments/validation-errors :: fieldError('mobile')}"></div>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <button type="submit" class="btn btn-primary"
                    th:text="${userForm.id != null ? 'Save changes' : 'Add user'}">
              Add user
            </button>
            <a th:href="@{/users}" class="btn btn-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </section>
</body>
</html>
