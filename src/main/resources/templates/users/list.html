<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout('Users', ~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Users - User Management</title>
  <link rel="stylesheet" th:href="@{/css/application.css}" href="../../static/css/application.css">
</head>
<body>
  <section>
    <div class="card">
      <div class="card-header">
        <div class="card-header-titles">
          <h1 class="card-title">Users</h1>
          <p class="card-subtitle">Manage user records, contact details, and account status.</p>
        </div>
        <div>
          <a th:href="@{/users/new}" class="btn btn-primary">
            Add user
          </a>
        </div>
      </div>

      <!-- Empty state when no users exist -->
      <div th:if="${users == null or #lists.isEmpty(users)}" class="empty-state">
        <h2 class="empty-state-title">No users found</h2>
        <p class="empty-state-desc">The user directory is currently empty. Get started by creating your first user record.</p>
        <a th:href="@{/users/new}" class="btn btn-primary">Add the first user</a>
      </div>

      <!-- Populated table of users -->
      <div th:if="${users != null and not #lists.isEmpty(users)}" class="table-responsive">
        <table class="data-table" aria-label="Users list">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Mobile</th>
              <th scope="col" class="actions-cell">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="user : ${users}">
              <td th:text="${user.name}">John Doe</td>
              <td th:text="${user.email}">john.doe@example.com</td>
              <td th:text="${user.mobile}">+1234567890</td>
              <td class="actions-cell">
                <div class="actions-cell-content">
                  <a th:href="@{/users/{id}/edit(id=${user.id})}"
                     class="action-link"
                     th:aria-label="'Edit ' + ${user.name}">
                    Edit
                  </a>
                  <span aria-hidden="true" style="color: var(--color-border);">&bull;</span>
                  <form th:action="@{/users/{id}/delete(id=${user.id})}"
                        method="post"
                        class="inline-form"
                        onsubmit="return confirm('Are you sure you want to delete this user?');">
                    <button type="submit"
                            class="btn-danger-link"
                            th:aria-label="'Delete ' + ${user.name}">
                      Delete
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</body>
</html>
